name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add the licensed font (kept out of the public repo)
        env:
          FONT_B64: ${{ secrets.DELIGHT_BLACK_WOFF2_B64 }}
        run: |
          mkdir -p public/fonts
          if [ -n "$FONT_B64" ]; then echo "$FONT_B64" | base64 -d > public/fonts/Delight-Black.woff2
          else echo "::warning::DELIGHT_BLACK_WOFF2_B64 secret missing, the game will use a fallback font"; fi
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
