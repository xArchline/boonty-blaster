<!doctype html>
<html><head><meta charset="utf-8"><title>Concept mockups</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c" width="390" height="780"></canvas>
<script>
// Static concept mockups for the pitch. Pick a scene with #rush, #blaster, #drop, #survivors.
const W = 390, H = 780;
const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, fill, stroke = '#1d1340', align = 'center') {
  g.font = `900 ${size}px "Arial Rounded MT Bold","Nunito","Arial Black",sans-serif`;
  g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (stroke) { g.lineWidth = Math.max(3, size / 6); g.strokeStyle = stroke; g.strokeText(s, x, y); }
  g.fillStyle = fill; g.fillText(s, x, y);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return `rgb(${f(r)},${f(gg)},${f(b)})`;
}
// Cute blob character: squishy body, big eyes, cheeks.
function blob(x, y, r, col, o = {}) {
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(0, r * .95, r * .9, r * .28, 0, 0, 7); g.fill();
  const gr = g.createRadialGradient(-r * .35, -r * .45, r * .1, 0, 0, r * 1.1);
  gr.addColorStop(0, shade(col, .45)); gr.addColorStop(.6, col); gr.addColorStop(1, shade(col, -.25));
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, r * (o.sx || 1), r * (o.sy || 1), 0, 0, 7); g.fill();
  g.lineWidth = Math.max(1.5, r * .09); g.strokeStyle = shade(col, -.5); g.stroke();
  if (o.ears) { g.fillStyle = col; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * r * .55, -r * .85, r * .22, r * .35, s * .4, 0, 7); g.fill(); g.stroke(); } }
  const ex = r * .32, ey = -r * .1, er = r * (o.angry ? .17 : .22);
  for (const s of [-1, 1]) {
    g.fillStyle = '#fff'; g.beginPath(); g.arc(s * ex, ey, er, 0, 7); g.fill();
    g.fillStyle = '#1d1340'; g.beginPath(); g.arc(s * ex + r * .04, ey + r * .03, er * .62, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(s * ex + r * .1, ey - r * .05, er * .25, 0, 7); g.fill();
    if (o.angry) { g.strokeStyle = '#1d1340'; g.lineWidth = r * .1; g.beginPath(); g.moveTo(s * r * .55, -r * .45); g.lineTo(s * r * .12, -r * .3); g.stroke(); }
    else { g.fillStyle = 'rgba(255,120,150,.55)'; g.beginPath(); g.ellipse(s * r * .58, r * .22, r * .14, r * .08, 0, 0, 7); g.fill(); }
  }
  g.strokeStyle = '#1d1340'; g.lineWidth = Math.max(1.2, r * .07); g.lineCap = 'round'; g.beginPath();
  if (o.angry) { g.moveTo(-r * .15, r * .35); g.lineTo(r * .15, r * .35); } else g.arc(0, r * .2, r * .16, .2, Math.PI - .2);
  g.stroke();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(-r * .45, -r * .55, r * .2, r * .12, -.6, 0, 7); g.fill();
  g.restore();
}
function hud(level, coins, accent) {
  rr(14, 18, 110, 38, 19); g.fillStyle = 'rgba(29,19,64,.55)'; g.fill();
  txt('LEVEL ' + level, 69, 38, 17, '#fff', null);
  rr(W - 124, 18, 110, 38, 19); g.fillStyle = 'rgba(29,19,64,.55)'; g.fill();
  g.fillStyle = '#ffc93c'; g.beginPath(); g.arc(W - 104, 37, 12, 0, 7); g.fill(); g.strokeStyle = '#c98a00'; g.lineWidth = 3; g.stroke();
  txt(coins, W - 60, 38, 17, '#fff', null);
}
function progress(p, col) {
  rr(95, 70, 200, 14, 7); g.fillStyle = 'rgba(29,19,64,.35)'; g.fill();
  rr(97, 72, 196 * p, 10, 5); g.fillStyle = col; g.fill();
}
function finger(x, y, dir) {
  g.save(); g.translate(x, y); g.globalAlpha = .92;
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 5; g.setLineDash([10, 9]); g.lineCap = 'round';
  g.beginPath(); g.moveTo(-60 * dir, 10); g.lineTo(60 * dir, 10); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#fff'; g.strokeStyle = '#1d1340'; g.lineWidth = 3;
  rr(-12, -8, 24, 44, 12); g.fill(); g.stroke();
  rr(-20, 18, 40, 38, 14); g.fill(); g.stroke();
  g.restore();
}
function banner(s, y, col) { txt(s, W / 2, y, 30, col, '#1d1340'); }

// ---------- 1. RUSH: gate runner / crowd shooter ----------
function rush() {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#7fd3ff'); sky.addColorStop(.45, '#bfeaff'); sky.addColorStop(.46, '#8be07a'); sky.addColorStop(1, '#5cc15a');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // road in perspective
  const hy = 250, top = 70, bot = 330;
  g.fillStyle = '#ffe3b3'; g.beginPath(); g.moveTo(W / 2 - top, hy); g.lineTo(W / 2 + top, hy); g.lineTo(W / 2 + bot, H); g.lineTo(W / 2 - bot, H); g.fill();
  g.fillStyle = '#ffd08a'; for (let i = 0; i < 9; i++) { const t0 = i / 9, t1 = t0 + .05; const y0 = hy + (H - hy) * t0 * t0, y1 = hy + (H - hy) * t1 * t1; g.fillRect(W / 2 - 2 - 4 * t0, y0, 4 + 8 * t0, y1 - y0); }
  // trees
  for (const [x, y, s] of [[40, 300, 26], [350, 320, 30], [20, 420, 34], [372, 470, 36], [30, 600, 44]]) {
    g.fillStyle = '#8a5a2b'; g.fillRect(x - s * .12, y, s * .24, s * .7); g.fillStyle = '#2f9e44'; g.beginPath(); g.arc(x, y, s * .6, 0, 7); g.fill(); g.fillStyle = '#51cf66'; g.beginPath(); g.arc(x - s * .15, y - s * .15, s * .35, 0, 7); g.fill();
  }
  // enemy crowd far away
  seed = 3; for (let i = 0; i < 18; i++) blob(W / 2 - 40 + rnd() * 80, 262 + rnd() * 22, 8, '#ff5c5c', { angry: true });
  rr(W / 2 - 26, 222, 52, 26, 13); g.fillStyle = '#ff5c5c'; g.fill(); txt('45', W / 2, 236, 18, '#fff');
  // gates
  const gy = 380, gh = 95;
  const gate = (x, w, col, label) => {
    g.fillStyle = col + 'aa'; rr(x, gy, w, gh, 10); g.fill();
    g.strokeStyle = shade(col, -.3); g.lineWidth = 6; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x + 8, gy + 8, w * .18, gh - 16);
    txt(label, x + w / 2, gy + gh / 2, 44, '#fff');
  };
  gate(38, 150, '#2f9bff', '+20'); gate(202, 150, '#20c997', '×2');
  // bullets
  g.fillStyle = '#ffe066'; seed = 11; for (let i = 0; i < 14; i++) { const x = 150 + rnd() * 90, y = 300 + rnd() * 240; rr(x, y, 5, 14, 3); g.fill(); }
  // player crowd
  seed = 5; const pts = []; for (let i = 0; i < 36; i++) { const a = rnd() * 7, d = Math.sqrt(rnd()) * 70; pts.push([W / 2 + 10 + Math.cos(a) * d * 1.2, 630 + Math.sin(a) * d * .6]); }
  pts.sort((a, b) => a[1] - b[1]); for (const [x, y] of pts) blob(x, y, 14, '#8b5cf6', { ears: true });
  rr(W / 2 - 30, 548, 60, 30, 15); g.fillStyle = '#8b5cf6'; g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke(); txt('36', W / 2, 564, 20, '#fff');
  hud(12, '1,240'); progress(.55, '#8b5cf6');
  finger(W / 2 + 10, 700, 1);
}

// ---------- 2. BLASTER: Mob Control style cannon + multiplier gates ----------
function blaster() {
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#ffb3d1'); bg.addColorStop(1, '#ffe0ec');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // arena floor
  rr(20, 110, W - 40, H - 150, 28); g.fillStyle = '#fff4f8'; g.fill(); g.strokeStyle = '#f4a3c4'; g.lineWidth = 4; g.stroke();
  g.strokeStyle = 'rgba(244,163,196,.35)'; g.lineWidth = 2; for (let y = 150; y < H - 60; y += 40) { g.beginPath(); g.moveTo(30, y); g.lineTo(W - 30, y); g.stroke(); }
  // enemy base
  rr(W / 2 - 70, 120, 140, 90, 18); g.fillStyle = '#ff5c5c'; g.fill(); g.strokeStyle = '#a61e4d'; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#a61e4d'; for (let i = 0; i < 4; i++) g.fillRect(W / 2 - 62 + i * 36, 106, 22, 20);
  blob(W / 2, 168, 26, '#ff8787', { angry: true });
  rr(W / 2 - 60, 220, 120, 16, 8); g.fillStyle = '#1d134055'; g.fill(); rr(W / 2 - 58, 222, 116 * .35, 12, 6); g.fillStyle = '#51cf66'; g.fill();
  // enemy mob coming
  seed = 9; for (let i = 0; i < 12; i++) blob(80 + rnd() * 90, 260 + rnd() * 70, 11, '#ff6b6b', { angry: true });
  // gates: one moving multiplier bar
  const gate = (x, y, w, col, label) => { rr(x, y, w, 44, 12); g.fillStyle = col + 'cc'; g.fill(); g.strokeStyle = shade(col, -.35); g.lineWidth = 5; g.stroke(); txt(label, x + w / 2, y + 22, 30, '#fff'); };
  gate(190, 330, 150, '#20c997', '×3');
  gate(50, 470, 130, '#2f9bff', '+10');
  // stream of minis: few below the gate, many above
  seed = 21;
  for (let i = 0; i < 9; i++) blob(W / 2 + 45 + (rnd() - .5) * 30, 600 - i * 26, 10, '#ffd43b');
  for (let i = 0; i < 30; i++) blob(200 + rnd() * 140, 140 + 30 + rnd() * 150 + 60, 10, '#ffd43b');
  // pops
  for (const [x, y] of [[250, 240], [300, 215], [215, 270]]) { g.strokeStyle = '#fff'; g.lineWidth = 4; for (let k = 0; k < 8; k++) { const a = k / 8 * 6.28; g.beginPath(); g.moveTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12); g.lineTo(x + Math.cos(a) * 22, y + Math.sin(a) * 22); g.stroke(); } }
  gate(190, 330, 150, '#20c997', '×3');
  txt('×3!', 330, 290, 26, '#ffd43b');
  // cannon (Boonty mascot on a cannon)
  g.fillStyle = '#6741d9'; rr(W / 2 + 25, 630, 40, 70, 14); g.fill(); g.strokeStyle = '#1d1340'; g.lineWidth = 4; g.stroke();
  blob(W / 2 + 45, 700, 36, '#8b5cf6', { ears: true });
  hud(7, '860'); progress(.35, '#ff5c5c');
  finger(W / 2 + 45, 745, 1);
}

// ---------- 3. DROP: Suika-style drop & merge with cute creatures ----------
const tiers = [['#ff8fab', 14], ['#ffd43b', 19], ['#69db7c', 25], ['#4dabf7', 32], ['#9775fa', 40], ['#ff922b', 50], ['#f06595', 62]];
function drop() {
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#fff3bf'); bg.addColorStop(1, '#ffd8a8');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.4)'; seed = 2; for (let i = 0; i < 20; i++) { g.beginPath(); g.arc(rnd() * W, rnd() * H, 4 + rnd() * 10, 0, 7); g.fill(); }
  // score
  txt('2,480', W / 2, 60, 44, '#fff', '#e8590c');
  txt('BEST 3,910', W / 2, 96, 15, '#e8590c', null);
  // next preview
  rr(W - 90, 20, 70, 70, 20); g.fillStyle = 'rgba(255,255,255,.7)'; g.fill(); txt('NEXT', W - 55, 34, 12, '#e8590c', null); blob(W - 55, 62, 16, tiers[1][0]);
  // jar
  const jx = 35, jy = 200, jw = W - 70, jh = 520;
  rr(jx, jy, jw, jh, 26); g.fillStyle = 'rgba(255,255,255,.55)'; g.fill(); g.strokeStyle = '#e8590c'; g.lineWidth = 7; g.stroke();
  g.setLineDash([8, 8]); g.strokeStyle = '#ff6b6b88'; g.lineWidth = 3; g.beginPath(); g.moveTo(jx + 10, jy + 60); g.lineTo(jx + jw - 10, jy + 60); g.stroke(); g.setLineDash([]);
  // held piece + drop guide
  g.strokeStyle = 'rgba(232,89,12,.4)'; g.lineWidth = 3; g.setLineDash([6, 8]); g.beginPath(); g.moveTo(230, 170); g.lineTo(230, 470); g.stroke(); g.setLineDash([]);
  blob(230, 150, tiers[2][1], tiers[2][0], { ears: true });
  // stacked pieces (hand-placed to look settled)
  const P = [[100, 655, 6], [220, 668, 5], [306, 668, 4], [118, 555, 4], [300, 580, 3], [240, 590, 2], [70, 520, 2], [165, 505, 3], [255, 530, 1], [342, 530, 2], [210, 480, 0], [300, 490, 1], [108, 460, 1], [150, 455, 0], [340, 470, 0]];
  for (const [x, y, t] of P) blob(x, y, tiers[t][1], tiers[t][0], { ears: t % 2 === 1 });
  // merge burst
  g.save(); g.translate(165, 505); g.strokeStyle = '#fff'; g.lineWidth = 5; for (let k = 0; k < 10; k++) { const a = k / 10 * 6.28; g.beginPath(); g.moveTo(Math.cos(a) * 46, Math.sin(a) * 46); g.lineTo(Math.cos(a) * 62, Math.sin(a) * 62); g.stroke(); } g.restore();
  txt('MERGE! +64', 165, 420, 24, '#fff', '#e8590c');
  // evolution strip
  rr(20, 735, W - 40, 36, 18); g.fillStyle = 'rgba(255,255,255,.7)'; g.fill();
  tiers.forEach(([c], i) => blob(45 + i * 50, 753, 8 + i * 1.3, c));
}

// ---------- 4. SURVIVORS: move, auto-shoot, pick 1 of 3 upgrades ----------
function survivors() {
  g.fillStyle = '#7bd389'; g.fillRect(0, 0, W, H);
  seed = 4; for (let i = 0; i < 70; i++) { g.fillStyle = rnd() > .5 ? '#6cc47b' : '#8fdc9b'; g.beginPath(); g.ellipse(rnd() * W, rnd() * H, 10 + rnd() * 20, 6 + rnd() * 10, 0, 0, 7); g.fill(); }
  for (let i = 0; i < 14; i++) { const x = rnd() * W, y = rnd() * H; g.fillStyle = ['#fff', '#ffd43b', '#ff8fab'][i % 3]; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.26) * 4, y + Math.sin(k * 1.26) * 4, 3, 0, 7); g.fill(); } }
  const cx = W / 2, cy = 420;
  // xp gems
  for (let i = 0; i < 16; i++) { const x = 30 + rnd() * (W - 60), y = 130 + rnd() * 560; g.fillStyle = '#3bc9db'; g.beginPath(); g.moveTo(x, y - 7); g.lineTo(x + 5, y); g.lineTo(x, y + 7); g.lineTo(x - 5, y); g.fill(); }
  // enemies ring
  for (let i = 0; i < 26; i++) { const a = rnd() * 6.28, d = 130 + rnd() * 170; blob(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 1.1, 13 + rnd() * 5, i % 5 ? '#b197fc' : '#ff6b6b', { angry: true }); }
  // aura + orbiting stars
  g.fillStyle = 'rgba(255,212,59,.18)'; g.beginPath(); g.arc(cx, cy, 95, 0, 7); g.fill();
  for (let k = 0; k < 3; k++) { const a = k * 2.09 + .4; const x = cx + Math.cos(a) * 75, y = cy + Math.sin(a) * 75; g.fillStyle = '#ffd43b'; g.strokeStyle = '#e67700'; g.lineWidth = 3; g.beginPath(); for (let j = 0; j < 10; j++) { const r = j % 2 ? 7 : 16, b = j / 10 * 6.28 - 1.57; g.lineTo(x + Math.cos(b) * r, y + Math.sin(b) * r); } g.closePath(); g.fill(); g.stroke(); }
  // projectiles
  g.fillStyle = '#fff'; for (const [x, y] of [[cx + 60, cy - 50], [cx + 100, cy - 90], [cx - 70, cy + 40], [cx + 20, cy + 110]]) { g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); }
  blob(cx, cy, 28, '#8b5cf6', { ears: true });
  // damage numbers
  txt('24', cx + 115, cy - 110, 20, '#fff'); txt('24', cx - 95, cy + 20, 20, '#fff'); txt('CRIT 61', cx + 60, cy + 100, 20, '#ffd43b');
  // HUD: timer + xp
  rr(14, 16, W - 28, 16, 8); g.fillStyle = '#1d134066'; g.fill(); rr(16, 18, (W - 32) * .92, 12, 6); g.fillStyle = '#3bc9db'; g.fill();
  txt('03:42', W / 2, 62, 28, '#fff'); txt('☠ 318', 60, 62, 18, '#fff');
  // level-up overlay (bottom)
  g.fillStyle = 'rgba(29,19,64,.55)'; g.fillRect(0, 560, W, H - 560);
  banner('LEVEL UP!', 590, '#ffd43b');
  const cards = [['#ffd43b', 'Star Orbit', '+1 star'], ['#ff6b6b', 'Fire Paws', 'burn 3s'], ['#4dabf7', 'Magnet', 'grab XP']];
  cards.forEach(([c, n, d], i) => {
    const x = 18 + i * 120, y = 620; rr(x, y, 110, 140, 16); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = c; g.lineWidth = 6; g.stroke();
    g.fillStyle = c; g.beginPath(); g.arc(x + 55, y + 45, 26, 0, 7); g.fill();
    txt(n, x + 55, y + 95, 15, '#1d1340', null); txt(d, x + 55, y + 118, 13, '#868e96', null);
  });
}

({ rush, blaster, drop, survivors }[location.hash.slice(1)] || rush)();
</script></body></html>
