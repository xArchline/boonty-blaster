<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6173EB">
  <meta name="description" content="Hold to fire, drag to aim. Don't let a Grump cross your line!">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blaster">
  <title>Boonty Blaster</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preload" href="./fonts/Delight-Black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <section id="title" class="screen">
    <img class="logo" src="/assets/logo-white.svg" alt="Boonty">
    <h1>BLASTER</h1>
    <p>Hold to fire, drag to aim. Don't let a Grump cross your line!</p>
    <div class="pick-label">CHOOSE YOUR HERO</div>
    <div id="heroes" class="heroes"></div>
    <p id="hero-power" class="power"></p>
    <button id="play">PLAY</button>
    <button id="new-game" class="secondary" hidden>NEW GAME · LEVEL 1</button>
    <div class="shop"></div>
  </section>

  <section id="win" class="screen" hidden>
    <img id="win-img" class="hero small" src="/assets/boonty-party.webp" alt="">
    <h2 id="win-title">Level cleared!</h2>
    <div id="win-gold" class="reward big"><span class="coin"></span><span class="amount">+0</span></div>
    <p id="win-sub"></p>
    <button id="next">NEXT LEVEL</button>
    <div class="shop"></div>
    <button id="menu-win" class="secondary">MENU</button>
  </section>

  <section id="lose" class="screen" hidden>
    <img class="hero small" src="/assets/boonty-hi.webp" alt="">
    <h2>So close!</h2>
    <div id="lose-gold" class="reward"><span class="coin"></span><span class="amount">+0</span></div>
    <p id="lose-sub"></p>
    <button id="retry">TRY AGAIN</button>
    <div class="shop"></div>
    <button id="restart" class="secondary">START OVER · LEVEL 1</button>
    <button id="menu-lose" class="secondary">MENU</button>
  </section>

  <section id="pause" class="screen" hidden>
    <h2>Paused</h2>
    <button id="resume">RESUME</button>
    <button id="restart-level" class="secondary">RESTART LEVEL</button>
    <button id="menu-pause" class="secondary">MENU</button>
  </section>

  <section id="settings" class="screen" hidden>
    <h2>Settings</h2>
    <button id="mute-2" class="secondary" type="button">SOUND ON</button>
    <button id="reset" class="secondary danger" type="button">RESET ALL PROGRESS</button>
    <p class="note">Back to level 1 with 0 gold, no upgrades and only Sir Boonty.</p>
    <p id="reset-done" class="done" hidden>Progress reset. Fresh start!</p>
    <button id="settings-back">BACK</button>
  </section>

  <button id="pause-btn" class="pause-btn" type="button" aria-label="Pause" hidden><i></i><i></i></button>
  <button id="settings-btn" class="gear" type="button" aria-label="Settings">⚙</button>
  <button id="mute" class="mute" type="button">SOUND ON</button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
